# dsh-workbuddy-cooldown bundle patch.
#
# This is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI, the command reconciles
# `dsh.profile.bundles` against installed packages and appends
# `dsh-workbuddy-cooldown` to the bundle stack.
#
# `id` is the loader row's label; `name` must be the FULL package specifier
# exactly as installed in the profile's node_modules.
- insert:
    - id: workbuddy-cooldown
      name: "dsh-workbuddy-cooldown"
